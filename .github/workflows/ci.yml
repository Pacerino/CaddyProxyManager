name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded PR runs; let master and tag runs always finish so every
# merge and release gets its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    # The project uses a pure-Go sqlite driver, so no C toolchain is needed.
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The backend embeds frontend assets; provide a placeholder so it builds.
      - name: Create embed placeholder
        run: mkdir -p embed/assets && echo "<!doctype html>" > embed/assets/index.html
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  test-frontend:
    name: Test & build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
      - name: Type-check and build
        run: |
          mkdir -p ../backend/embed/assets
          npm run build

  docker:
    name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Build & publish' || 'Build' }} image (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock Caddy release.
          - flavor: default
            suffix: ""
            plugins: ""
          # Caddy built with common DNS providers for ACME DNS-01 challenges.
          - flavor: dns
            suffix: "-dns"
            plugins: >-
              github.com/caddy-dns/cloudflare
              github.com/caddy-dns/duckdns
              github.com/caddy-dns/porkbun
    steps:
      - uses: actions/checkout@v4

      # QEMU is only needed for the few RUN steps in the runtime stage; all
      # compilation is cross-compiled natively (see Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Images are only published for version tags; PRs and master pushes
      # just build them to verify.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` (and `latest-dns`) follow the newest stable release tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            CADDY_PLUGINS=${{ matrix.plugins }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

  release:
    name: Build binaries & release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    # Only build downloadable binaries and a release on version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the SPA so it gets embedded into every binary.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Cross-compile a static, pure-Go binary for each target and package it.
      - name: Build binaries
        working-directory: backend
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"

          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            name="caddyproxymanager_${VERSION}_${os}_${arch}"
            bin="cpm"
            [ "$os" = "windows" ] && bin="cpm.exe"
            echo "Building $name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "$bin" ./cmd/main.go
            if [ "$os" = "windows" ]; then
              zip -j "$OUT/${name}.zip" "$bin"
            else
              tar -czf "$OUT/${name}.tar.gz" "$bin"
            fi
            rm -f "$bin"
          done

          cd "$OUT"
          sha256sum * > checksums.txt
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
